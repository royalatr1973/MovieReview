databases:
  - name: cinereview-db
    plan: free
    databaseName: cinereview
    user: cinereview

services:
  - type: web
    name: cinereview-api
    plan: free
    runtime: node
    rootDir: .
    buildCommand: chmod +x render-build.sh && ./render-build.sh
    startCommand: cd apps/server && npx prisma db push --skip-generate && node dist/index.js
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: cinereview-db
          property: connectionString
